name: Construir APK AulaNova IA

on:
  workflow_dispatch:
  push:
    branches: ["AulaNova-IA"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Habilitar micrófono
        run: |
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml || sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' android/app/src/main/AndroidManifest.xml
      - name: Sincronizar Capacitor
        run: npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AulaNovaIA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
